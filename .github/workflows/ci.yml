name: CI

on:
  push:
    branches: [main, dev, qa, sit, uat]
  pull_request:
    branches: [main, dev, qa, sit, uat]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Lint
        run: python -m ruff check src/ tests/

      - name: Format check
        run: python -m ruff format --check src/ tests/

      - name: Type check
        run: python -m mypy src/ --ignore-missing-imports

      - name: Tests with coverage
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Best practices check
        run: |
          echo "Checking best practices compliance..."
          python -c "
          import ast, sys
          errors = []
          for f in ['src/app.py', 'src/models.py', 'src/store.py']:
              with open(f) as fh:
                  tree = ast.parse(fh.read())
              for node in ast.walk(tree):
                  if isinstance(node, ast.FunctionDef):
                      if node.returns is None and not node.name.startswith('_'):
                          errors.append(f'{f}:{node.lineno} {node.name}() missing return type')
          if errors:
              print('❌ Best practices violations:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)
          else:
              print('✅ Best practices passed')
          "

      - name: Security scan
        run: python -m pip-audit --desc || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
