name: Auto-Promote

on:
  push:
    branches: [dev, qa, sit, uat]

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine next environment
        id: env
        run: |
          case "${{ github.ref_name }}" in
            dev)  echo "next=qa" >> $GITHUB_OUTPUT ;;
            qa)   echo "next=sit" >> $GITHUB_OUTPUT ;;
            sit)  echo "next=uat" >> $GITHUB_OUTPUT ;;
            uat)  echo "next=main" >> $GITHUB_OUTPUT ;;
          esac

      - name: Create PR to next environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT="${{ steps.env.outputs.next }}"
          CURRENT="${{ github.ref_name }}"

          # Check if PR already exists
          EXISTING=$(gh pr list --base "$NEXT" --head "$CURRENT" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists for $CURRENT → $NEXT"
          else
            gh pr create \
              --base "$NEXT" \
              --head "$CURRENT" \
              --title "promote: $CURRENT → $NEXT" \
              --body "Auto-promoted from $CURRENT branch. CI passed, ready for review."
            echo "Created PR for $CURRENT → $NEXT"
          fi
